[project]
name = "universal-converter"
version = "0.1.0"
description = "Universal mapping-driven converter for ParkAPI sources"
requires-python = ">=3.12"
dependencies = [
    "requests~=2.32.5",
    "validataclass~=0.11.0",
    "openpyxl~=3.1.5",
    "lxml~=6.0.2",
    "isodate~=0.7.2",
    "shapely~=2.1.2",
    "urllib3~=2.6.3",
    "pyyaml~=6.0.3",
    "parkapi-sources~=0.35.0",
]

[project.optional-dependencies]
testing = [
    "pytest~=9.0.2",
    "pytest-cov~=7.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
testpaths = ["tests"]
